# Hermes综合技能集成系统配置
# Integrated Skills System Configuration

# 系统配置
system:
  name: "Hermes综合技能集成系统"
  version: "1.0.0"
  description: "基于GitHub学习成果的完整技能管理、记忆系统和代理编排系统"
  author: "小黑 (Xiao Hei)"
  language: ["zh-CN", "en"]
  
  # 性能配置
  performance:
    max_workers: 4
    cache_size: 1000
    timeout: 300
    retry_count: 3

# 技能管理配置
skills:
  directory: "~/.hermes/skills"
  auto_discovery: true
  auto_update: false
  validation_required: true
  categories:
    - "development"
    - "testing"
    - "security"
    - "data-processing"
    - "media"
    - "database"
    - "api"
    - "automation"
    - "integration"
    - "utility"

# 记忆系统配置
memory:
  directory: "~/.hermes/memory"
  database: "memories.db"
  backup:
    auto_backup: true
    backup_interval: "daily"
    max_backups: 30
  retention:
    keep_days: 365
    max_memories: 10000
  categories:
    - name: "user_preferences"
      description: "用户偏好和设置"
      priority: "high"
    - name: "environment_facts"
      description: "环境信息和事实"
      priority: "medium"
    - name: "skill_knowledge"
      description: "技能知识和模式"
      priority: "medium"
    - name: "project_context"
      description: "项目上下文信息"
      priority: "high"
    - name: "conversation_history"
      description: "对话历史和洞察"
      priority: "low"
    - name: "learned_patterns"
      description: "学习到的模式"
      priority: "medium"
    - name: "error_patterns"
      description: "错误模式和解决方案"
      priority: "high"
    - name: "performance_metrics"
      description: "性能指标和数据"
      priority: "low"

# 代理编排配置
agents:
  orchestrator:
    max_concurrent_tasks: 10
    default_timeout: 300
    retry_on_failure: true
    max_retries: 3
  
  # 专业代理配置
  types:
    - name: "planner"
      description: "规划代理 - 任务分解和规划"
      capabilities: ["task_decomposition", "dependency_analysis", "resource_planning"]
      priority: 5
      
    - name: "architect"
      description: "架构代理 - 系统设计和架构"
      capabilities: ["system_design", "architecture_patterns", "scalability"]
      priority: 5
      
    - name: "tdd-guide"
      description: "TDD代理 - 测试驱动开发"
      capabilities: ["test_first", "coverage_enforcement", "refactoring"]
      priority: 4
      
    - name: "code-reviewer"
      description: "代码审查代理 - 代码质量检查"
      capabilities: ["code_quality", "style_consistency", "performance_review"]
      priority: 4
      
    - name: "security-reviewer"
      description: "安全审查代理 - 漏洞检测"
      capabilities: ["vulnerability_detection", "security_patterns", "compliance"]
      priority: 5
      
    - name: "build-error-resolver"
      description: "构建错误解决代理 - 修复构建错误"
      capabilities: ["error_analysis", "dependency_resolution", "build_optimization"]
      priority: 3
      
    - name: "refactor-cleaner"
      description: "重构清理代理 - 代码重构和清理"
      capabilities: ["dead_code_removal", "code_simplification", "structure_improvement"]
      priority: 2
      
    - name: "doc-updater"
      description: "文档更新代理 - 文档生成和更新"
      capabilities: ["documentation_generation", "api_docs", "code_comments"]
      priority: 2
      
    - name: "debugger"
      description: "调试代理 - 问题诊断和修复"
      capabilities: ["bug_analysis", "log_analysis", "debugging_tools"]
      priority: 3
      
    - name: "testing"
      description: "测试代理 - 测试执行和验证"
      capabilities: ["test_execution", "coverage_analysis", "test_generation"]
      priority: 3
      
    - name: "performance"
      description: "性能优化代理 - 性能分析和优化"
      capabilities: ["performance_analysis", "bottleneck_detection", "optimization"]
      priority: 3
      
    - name: "database"
      description: "数据库代理 - 数据库设计和优化"
      capabilities: ["schema_design", "query_optimization", "data_modeling"]
      priority: 3
      
    - name: "api-designer"
      description: "API设计代理 - API设计和文档"
      capabilities: ["api_design", "endpoint_documentation", "api_testing"]
      priority: 3
      
    - name: "ui-designer"
      description: "UI设计代理 - 用户界面设计"
      capabilities: ["ui_design", "ux_optimization", "accessibility"]
      priority: 2
      
    - name: "devops"
      description: "DevOps代理 - 部署和运维"
      capabilities: ["deployment", "ci_cd", "monitoring"]
      priority: 3
      
    - name: "security-scanner"
      description: "安全扫描代理 - 安全扫描和审计"
      capabilities: ["security_scanning", "vulnerability_assessment", "compliance_audit"]
      priority: 4
      
    - name: "data-engineer"
      description: "数据工程代理 - 数据处理和管道"
      capabilities: ["data_pipeline", "etl", "data_processing"]
      priority: 3
      
    - name: "ml-engineer"
      description: "机器学习代理 - ML模型开发"
      capabilities: ["model_training", "feature_engineering", "model_deployment"]
      priority: 3
      
    - name: "general"
      description: "通用代理 - 一般任务处理"
      capabilities: ["general_tasks", "problem_solving", "research"]
      priority: 1

# 技能市场配置
marketplace:
  enabled: true
  sources:
    - name: "local"
      description: "本地技能库"
      enabled: true
      path: "~/.hermes/skills"
    
    - name: "github"
      description: "GitHub技能库"
      enabled: true
      api_url: "https://api.github.com"
      search_limit: 20
    
    - name: "community"
      description: "社区技能库"
      enabled: true
      api_url: "https://community.hermes.ai"
      search_limit: 10
  
  # 搜索配置
  search:
    max_results: 20
    min_score: 0.5
    fuzzy_matching: true
    category_filter: true
  
  # 安装配置
  installation:
    auto_dependency: true
    validation_required: true
    security_scan: true
    backup_before_install: true
  
  # 发布配置
  publishing:
    auto_publish: false
    validation_required: true
    license_check: true
    security_scan: true

# 集成配置
integrations:
  # GitHub集成
  github:
    enabled: true
    token_env: "GITHUB_TOKEN"
    auto_clone: true
    update_interval: "weekly"
  
  # 记忆集成
  memory:
    enabled: true
    auto_save: true
    auto_recall: true
    context_injection: true
  
  # 代理集成
  agents:
    enabled: true
    auto_select: true
    parallel_execution: true
    fallback_strategy: "graceful"

# 监控配置
monitoring:
  enabled: true
  metrics:
    - "skill_usage"
    - "agent_performance"
    - "memory_efficiency"
    - "system_health"
  
  logging:
    level: "INFO"
    file: "~/.hermes/logs/integrated-system.log"
    rotation: "daily"
    max_size: "100MB"
  
  alerts:
    enabled: true
    thresholds:
      error_rate: 0.1
      response_time: 5.0
      memory_usage: 0.8

# 安全配置
security:
  validation:
    input_validation: true
    output_sanitization: true
    code_review_required: true
  
  permissions:
    skill_execution: "restricted"
    memory_access: "controlled"
    agent_invocation: "authenticated"
  
  audit:
    enabled: true
    log_all_actions: true
    retention_days: 90

# 开发配置
development:
  debug_mode: false
  verbose_logging: false
  experimental_features: false
  
  # 测试配置
  testing:
    auto_test: true
    coverage_threshold: 80
    integration_tests: true
    e2e_tests: false

# 文档配置
documentation:
  auto_generate: true
  include_examples: true
  include_api_docs: true
  formats:
    - "markdown"
    - "html"
  
  # 翻译配置
  translation:
    enabled: true
    languages:
      - "zh-CN"
      - "en"
      - "ja"
      - "ko"

# 性能优化配置
optimization:
  caching:
    enabled: true
    ttl: 3600
    max_size: 1000
  
  compression:
    enabled: true
    algorithm: "gzip"
  
  lazy_loading:
    enabled: true
    threshold: 100

# 备份和恢复配置
backup:
  enabled: true
  schedule: "0 2 * * *"  # 每天凌晨2点
  retention:
    days: 30
    versions: 10
  
  storage:
    local: "~/.hermes/backup"
    remote: null  # 可配置云存储

# 更新配置
updates:
  auto_check: true
  check_interval: "daily"
  auto_update: false
  channels:
    - "stable"
    - "beta"
    - "dev"

# 兼容性配置
compatibility:
  hermes_version: ">=1.0.0"
  python_version: ">=3.8"
  platforms:
    - "linux"
    - "macos"
    - "windows"
  
  # 迁移配置
  migration:
    auto_migrate: true
    backup_before_migration: true
    rollback_on_error: true